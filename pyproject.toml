# Tooling config for the Python helper scripts (the site itself is built by blog-engine).

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "test_paper_discovery_scoring.py"]
