site:
  title: "Gratheon"
  tagline: "Beehive Data Analytics"
  url: "https://gratheon.com"
  baseUrl: "/"
  language: "en"
  logo: "/assets/img/logo_v7w.svg"
  favicon: "/assets/favicons/favicon.ico"

i18n:
  default: "en"
  browserRedirect:
    enabled: false
  languages:
    - code: "et"
      label: "Eesti"
      aliases: ["et", "et-ee"]

author:
  name: "Gratheon OÜ"
  email: "pilot@gratheon.com"

build:
  contentDir: "content"
  outputDir: "dist"
  cacheDir: ".cache"
  parallelWorkers: 4

navigation:
  header:
    enabled: true
    items:
      - title: "About"
        url: "/about/"
        languages: ["en"]
      - title: "Products"
        url: "/about/products/"
        languages: ["en"]
      - title: "Docs"
        url: "/docs/"
        languages: ["en"]
      - title: "Research"
        url: "/research/"
        languages: ["en"]
      - title: "Blog"
        url: "/blog/"
        languages: ["en"]
      - title: "Blogi"
        url: "/et/blog/"
        languages: ["et"]
      - title: "Pricing"
        url: "/pricing/"
        languages: ["en"]
      - title: "Discord"
        url: "https://discord.gg/PcbP4uedWj"
        class: "nav-action nav-action-first"
        languages: ["en"]
      - title: "GitHub"
        url: "https://github.com/gratheon/web-app"
        class: "nav-action"
        languages: ["en"]
      - title: "Log in"
        url: "https://app.gratheon.com/account/authenticate/"
        class: "nav-action"
        languages: ["en"]
  sidebar:
    collapsed: true
    maxDepth: 4
    sections:
      blog:
        defaultMode: "time"
        enableTime: true
        enableGraph: true
        matchPaths: ["blog"]
        sidebarRoot: "blog"
      docs:
        defaultMode: "categories"
        enableTime: false
        enableGraph: false
        matchPaths: ["docs"]
        sidebarRoot: "docs"
      research:
        defaultMode: "categories"
        enableTime: false
        enableGraph: false
        matchPaths: ["research"]
        sidebarRoot: "research"
      about:
        defaultMode: "categories"
        enableTime: false
        enableGraph: false
        matchPaths: ["about"]
        sidebarRoot: "about"
  breadcrumbs:
    enabled: true
    homeLabel: "Home"
  prevNext:
    enabled: true
    sameCategoryOnly: false

assets:
  images:
    enabled: true
    quality: 85
    sizes:
      thumbnail: 300
      preview: 800
      full: 1400
    lazyLoading: true
  css:
    enabled: true
    minify: true
  js:
    enabled: true
    minify: true

feeds:
  rss:
    enabled: true
    path: "rss.xml"
    items: 20
    fullContent: false
  atom:
    enabled: true
    path: "atom.xml"
    items: 20

sitemap:
  enabled: true

tags:
  enabled: true

archive:
  enabled: true

pagination:
  enabled: true
  pageSize: 20

advanced:
  mermaid:
    enabled: true
    theme: "default"
  graph:
    enabled: true
    path: "graph"
  theme:
    default: "light"
    allowToggle: false

seo:
  enabled: true
  defaultDescription: "Beehive data analytics and AI monitoring software for beekeepers."
  defaultImage: "/assets/img/gratheon-web-app.webp"
  twitter:
    site: "@gratheon"
    creator: "@gratheon"

homepage:
  enabled: false
