      label: "English"
      aliases: ["en", "en-us", "en-gb"]
    - code: "ru"
      label: "Русский"
      aliases: ["ru", "ru-ru"]
    - code: "et"
      label: "Eesti"
      aliases: ["et", "et-ee"]
    - code: "tr"
      label: "Türkçe"
      aliases: ["tr", "tr-tr"]
