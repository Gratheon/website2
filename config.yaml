site:
  title: "Gratheon"
  tagline: "Beehive Data Analytics"
  url: "https://gratheon.com"
  baseUrl: "/"
  language: "en"
  logo: "/assets/img/logo_v7w.svg"
  favicon: "/assets/favicons/favicon.ico"

i18n:
  default: "en"
  browserRedirect:
    enabled: false
  languages:
    - code: "en"
      label: "English"
      aliases: ["en", "en-us", "en-gb"]
    - code: "ru"
      label: "Русский"
      aliases: ["ru", "ru-ru"]
    - code: "et"
      label: "Eesti"
      aliases: ["et", "et-ee"]
    - code: "tr"
      label: "Türkçe"
      aliases: ["tr", "tr-tr"]
    - code: "pl"
      label: "Polski"
      aliases: ["pl", "pl-pl"]
    - code: "de"
      label: "Deutsch"
      aliases: ["de", "de-de"]
    - code: "fr"
      label: "Français"
      aliases: ["fr", "fr-fr"]
    - code: "zh"
      label: "简体中文"
      aliases: ["zh", "zh-cn", "zh-hans"]
    - code: "hi"
      label: "हिन्दी"
      aliases: ["hi", "hi-in"]
    - code: "es"
      label: "Español"
      aliases: ["es", "es-es", "es-mx"]
    - code: "ar"
      label: "العربية"
      aliases: ["ar", "ar-sa"]
    - code: "bn"
      label: "বাংলা"
      aliases: ["bn", "bn-bd"]
    - code: "pt"
      label: "Português"
      aliases: ["pt", "pt-br", "pt-pt"]
    - code: "ja"
      label: "日本語"
      aliases: ["ja", "ja-jp"]
    - code: "lv"
      label: "Latviešu"
      aliases: ["lv", "lv-lv"]
    - code: "lt"
      label: "Lietuvių"
      aliases: ["lt", "lt-lt"]
    - code: "hu"
      label: "Magyar"
      aliases: ["hu", "hu-hu"]
    - code: "uk"
      label: "Українська"
      aliases: ["uk", "uk-ua"]
    - code: "it"
      label: "Italiano"
      aliases: ["it", "it-it"]
    - code: "ro"
      label: "Română"
      aliases: ["ro", "ro-ro"]
author:
  name: "Gratheon OÜ"
  email: "pilot@gratheon.com"

build:
  contentDir: "content"
  outputDir: "dist"
  cacheDir: ".cache"
  parallelWorkers: 4

navigation:
  header:
    enabled: true
    items:
      - title: "About"
        url: "/about/"
      # Product labels are Gratheon-site copy. Keep them here rather than in blog-engine-md.
      - title: "Products"
        url: "/about/products/"
        languages: ["en"]
      - title: "Продукты"
        url: "/about/products/"
        languages: ["ru"]
      - title: "Tooted"
        url: "/about/products/"
        languages: ["et"]
      - title: "Ürünler"
        url: "/about/products/"
        languages: ["tr"]
      - title: "Produkty"
