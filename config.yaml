      label: "Italiano"
      aliases: ["it", "it-it"]
    - code: "ro"
      label: "Română"
      aliases: ["ro", "ro-ro"]
author:
  name: "Gratheon OÜ"
  email: "pilot@gratheon.com"

build:
  contentDir: "content"
  outputDir: "dist"
  cacheDir: ".cache"
  parallelWorkers: 4

