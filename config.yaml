      label: "日本語"
      aliases: ["ja", "ja-jp"]
    - code: "lv"
      label: "Latviešu"
      aliases: ["lv", "lv-lv"]
    - code: "lt"
      label: "Lietuvių"
      aliases: ["lt", "lt-lt"]
    - code: "hu"
      label: "Magyar"
      aliases: ["hu", "hu-hu"]
    - code: "uk"
      label: "Українська"
      aliases: ["uk", "uk-ua"]
