name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy production website
        run: ./scripts/deploy-production.sh

      - name: Verify active release on server
        run: |
          test -L /www/website/current
          test -f /www/website/current/index.html
          readlink /www/website/current

      - name: Verify public site
        run: |
          ./scripts/verify-production.sh https://gratheon.com/
          ./scripts/verify-production.sh https://gratheon.com/pricing/
          ./scripts/verify-production.sh https://gratheon.com/assets/css/main.css
          ./scripts/verify-production.sh https://gratheon.com/assets/js/main.js
