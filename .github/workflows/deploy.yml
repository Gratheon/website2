name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GRATHEON_PRODUCTION_SSH_KEY }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gratheon.com >> ~/.ssh/known_hosts

      - name: Pull and rebuild production
        run: |
          ssh root@gratheon.com 'bash -se' <<'EOF'
            set -euo pipefail
            cd /www/website
            runuser -u www -- git -C /www/website pull --ff-only origin main
            ./restart.sh
          EOF

      - name: Verify public site
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 https://gratheon.com/ > /tmp/gratheon.html
          test -s /tmp/gratheon.html
