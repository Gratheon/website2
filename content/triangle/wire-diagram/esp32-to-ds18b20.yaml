version: 1
title: ESP32 to DS18B20
description: 1-Wire temperature chain · GPIO 4, 3.3 V, 4.7 kOhm pull-up
notes:
  - Disconnect USB before changing wires. All modules share one GND rail.
  - DS18B20 VDD stays on 3.3 V. Do not tie the probe to the 5 V USB rail.
  - The 4.7 kOhm resistor joins 3.3 V to DQ. Never connect DQ directly to the power rail.
  - Probe data is brown or yellow depending on the cable. Match function, not colour alone.
  - Component sizes and pin anchors are illustrative. Match printed pin labels on the actual board.
groups:
  - { id: power, label: USB POWER, color: '#5c9fb5' }
  - { id: control, label: CONTROLLER, color: '#d2a454' }
  - { id: temp, label: TEMPERATURE CHAIN, color: '#b681a5' }
components:
  - id: usb
    label: USB 5 V / 2 A
    kind: power
    group: power
    dimensions: [28, 14, 22]
    position: [-88, 8, 0]
    schematic: [70, 95]
    pins:
      - { id: VBUS, label: '5 V', side: right, voltage: 5, position: [14, 2, -4] }
      - { id: GND, side: right, voltage: 0, position: [14, 2, 4] }
    notes: Powers the ESP32 over USB. The DS18B20 does not take 5 V from this rail.
  - id: esp
    label: ESP32 DevKit
    kind: esp32
    group: control
    dimensions: [52, 3, 28]
    position: [-20, 6, 0]
    schematic: [400, 95]
    pinout: esp32-devkit-38
    properties: { variant: 'ESP32-WROOM development board', logic: '3.3 V only', firmware: 'DS18B20_PIN = 4' }
    pins:
      # WHY: number/gpio bind 3D wires to DevKit header contacts and show Pin N / GPIOx on the schematic.
      - { id: VIN, label: '5 V / VIN', number: 19, side: left, voltage: 5 }
      - { id: GND, number: 14, side: left, voltage: 0 }
      - { id: 3V3, label: '3.3 V', number: 1, side: right, voltage: 3.3 }
      - { id: IO4, label: DQ, number: 26, gpio: 4, side: right }
  - id: pullup
    label: 4.7 kOhm pull-up
    kind: resistor
    group: temp
    dimensions: [10, 3, 3]
    position: [56, 6, 45]
    schematic: [760, 280]
    pins:
      - { id: VCC, side: left, position: [-7, 0, 0] }
      - { id: DQ, side: right, position: [7, 0, 0] }
    properties: { resistance: '4.7 kOhm' }
    notes: Hardware pull-up. The firmware does not enable an internal pull-up for this bus.
  - id: probe
    label: DS18B20 probe
    kind: probe
    group: temp
    dimensions: [50, 6, 6]
    position: [132, 5, 54]
    schematic: [1040, 95]
    pins:
      - { id: VDD, label: 'VDD · red', side: left, voltage: 3.3, position: [-28, 1.5, -2] }
      - { id: DQ, label: 'DQ · brown/yellow', side: left, position: [-28, 1.5, 0] }
      - { id: GND, label: 'GND · black', side: left, voltage: 0, position: [-28, 1.5, 2] }
    notes: Waterproof 3-wire probe. Do not power this probe from 5 V.
wires:
  - { id: usb-power, from: usb.VBUS, to: esp.VIN, color: '#c62828', label: USB 5 V, voltage: 5, lengthMm: 200, diameterMm: 1.6 }
  - { id: usb-ground, from: usb.GND, to: esp.GND, color: '#212121', voltage: 0, net: GND }
  - { id: probe-power, from: esp.3V3, to: probe.VDD, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3, notes: Dashed red is 3.3 V only. Do not tie DS18B20 VDD to the 5 V rail. }
  - { id: pullup-power, from: esp.3V3, to: pullup.VCC, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: probe-data, from: esp.GPIO4, to: pullup.DQ, color: '#6d4c41', net: DQ, notes: Brown or yellow jumper to the data node }
  - { id: probe-data-tail, from: pullup.DQ, to: probe.DQ, color: '#6d4c41', label: DQ, net: DQ }
  - { id: probe-ground, from: esp.GND, to: probe.GND, color: '#212121', voltage: 0, net: GND }
