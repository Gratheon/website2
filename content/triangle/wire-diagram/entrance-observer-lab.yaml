version: 1
title: Entrance Observer lab interconnect
description: Jetson Orin Nano Super + USB UVC camera · Phase 1 bench
notes:
  - This is a product interconnect, not a GPIO map. Confirm labels on the actual Jetson carrier.
  - Official Orin Nano power is the 19 V DC barrel (POWER). USB-C is data/recovery only, not kit power.
  - Prefer Ethernet for repeatable tests. The optional WiFi module reproduces field conditions.
  - The 7 inch HDMI panel is bench-only. Unplug it before unattended or outdoor runs.
  - The acrylic Nano 2 GB case is not assumed to fit Orin. Leave it off the powered stack.
groups:
  - { id: power, label: POWER, color: '#5c9fb5' }
  - { id: compute, label: EDGE COMPUTE, color: '#d2a454' }
  - { id: vision, label: VISION, color: '#64a888' }
  - { id: network, label: NETWORK, color: '#b681a5' }
components:
  - id: psu
    label: 19 V DC adapter
    kind: power
    group: power
    dimensions: [70, 32, 40]
    position: [-150, 20, 0]
    schematic: [40, 40]
    pins:
      - { id: VBUS, label: '19 V DC', side: right, voltage: 19, position: [35, 4, -8] }
      - { id: GND, side: right, voltage: 0, position: [35, 4, 8] }
    notes: Official-quality 19 V barrel adapter sized for Jetson, camera, SSD and WiFi under load. Exact SKU is still missing from the BOM.
  - id: jetson
    label: Jetson Orin Nano Super
    kind: jetson-orin-nano
    group: compute
    dimensions: [100, 18, 79]
    position: [0, 20, 0]
    schematic: [340, 40]
    pinout: jetson-orin-nano
    properties: { ram: '8 GB', role: 'Phase 1 reference compute' }
    purchase: { url: 'https://www.amazon.com/dp/B0BZJTQ5YP', label: 'Orin Nano Super 8 GB', partNumber: 'B0BZJTQ5YP' }
    pins:
      # WHY: no pin.position - wire-diagram lands POWER/USB3/ETH/DP on the builtin Orin ports.
      - { id: POWER, label: '19 V DC', side: left, voltage: 19 }
      - { id: USB3, label: USB 3.2, side: right }
      - { id: ETH, label: GbE, side: left }
      - { id: DP, label: DisplayPort, side: left }
      # WHY: M.2 is not a named Orin port alias; positions match the builtin Key M outline and a top-side Key E area.
      - { id: M2M, label: M.2 Key M, side: right, position: [-26, 1.35, -15.8] }
      - { id: M2E, label: M.2 Key E, side: right, position: [-20, 8, 18] }
    notes: Builtin jetson-orin-nano carrier. POWER is the 19 V barrel. USB-C is data/recovery only. Video is DisplayPort. USB3 is a Type-A stack port. Confirm labels on the board.
  - id: camera
    label: MOKOSE 4K USB UVC
    kind: camera
    group: vision
    dimensions: [42, 38, 38]
    position: [130, 58, 0]
    schematic: [700, 40]
    purchase: { url: 'https://www.amazon.com/dp/B0814VFG12', label: 'MOKOSE 4K UVC', partNumber: 'B0814VFG12' }
    pins:
      - { id: USB, label: USB 3.0, side: left, position: [-21, 0, 0] }
    notes: Bus-powered UVC camera. Use a USB 3 cable of the same length planned for field tests.
  - id: lan
    label: Lab Ethernet
    kind: board
    group: network
    dimensions: [36, 12, 28]
    position: [-95, 12, -60]
    schematic: [40, 360]
    pins:
      - { id: ETH, label: GbE, side: right, position: [18, 2, 0] }
    notes: Preferred lab path. Isolates camera and model bugs from WiFi retries.
  - id: ssd
    label: 250 GB NVMe SSD
    kind: ssd
    group: compute
    dimensions: [80, 2.4, 22]
    position: [8, 6, 52]
    schematic: [340, 360]
    purchase: { url: 'https://www.amazon.de/dp/B0CN3LQSBZ', label: 'SanDisk 250 GB NVMe', partNumber: 'B0CN3LQSBZ' }
    pins:
      - { id: M2, label: M.2 2280, side: left, position: [-40, 0, 0] }
    notes: Stores OS, Docker images, logs, clip buffers and benchmark videos.
  - id: wifi
    label: Waveshare AC8265
    kind: wifi
    group: network
    dimensions: [30, 2.4, 22]
    position: [18, 34, 30]
    schematic: [700, 360]
    purchase: { url: 'https://www.amazon.de/dp/B07SGDRG34', label: 'AC8265 M.2 WiFi', partNumber: 'B07SGDRG34' }
    pins:
      - { id: M2, label: M.2 Key E, side: left, position: [-15, 0, 0] }
    notes: Field-condition option. Keep Ethernet connected for the default lab path.
  - id: display
    label: 7 inch HDMI panel
    kind: display
    group: compute
    dimensions: [165, 100, 8]
    position: [-210, 58, 20]
    schematic: [340, 620]
    purchase: { url: 'https://www.amazon.com/dp/B0BKGCB18T', label: '7 inch HDMI touch', partNumber: 'B0BKGCB18T' }
    pins:
      - { id: HDMI, side: left, position: [-82, -46, 0] }
    notes: Optional bench display. The panel also needs USB power for the touch controller. Remove from field builds.
wires:
  - id: dc-power
    from: psu.VBUS
    to: jetson.POWER
    color: '#c62828'
    label: 19 V DC barrel
    voltage: 19
    lengthMm: 1200
    diameterMm: 3.2
    notes: Barrel cable to Jetson POWER. Return is in the same jack. Do not feed the kit from USB-C or a 5 V phone charger.
  - id: cam-usb
    from: camera.USB
    to: jetson.USB3
    color: '#1565c0'
    label: USB 3 UVC
    lengthMm: 3000
    diameterMm: 4
    gaugeAwg: 28
    notes: Camera is bus-powered. Long or poor cables can drop the UVC device.
  - id: nvme
    from: ssd.M2
    to: jetson.M2M
    color: '#6d4c41'
    label: NVMe
    lengthMm: 40
    diameterMm: 1.2
    notes: Internal M.2 Key M. Shown as a short interconnect, not a jumper wire.
  - id: wifi-m2
    from: wifi.M2
    to: jetson.M2E
    color: '#7b1fa2'
    label: M.2 WiFi
    dashed: true
    lengthMm: 30
    diameterMm: 1.2
    notes: Dashed because Ethernet is the default lab path.
  - id: ethernet
    from: lan.ETH
    to: jetson.ETH
    color: '#2e7d32'
    label: Gigabit Ethernet
    lengthMm: 1500
    diameterMm: 5
    notes: Preferred lab network. Use WiFi only when reproducing field bandwidth.
  - id: display-dp
    from: display.HDMI
    to: jetson.DP
    color: '#546e7a'
    label: DP to HDMI
    dashed: true
    lengthMm: 500
    diameterMm: 6
    notes: Optional. Orin video is DisplayPort; the 7 inch panel is HDMI, so this cable needs a DP-HDMI adapter. Unplug before outdoor or unattended runs.
