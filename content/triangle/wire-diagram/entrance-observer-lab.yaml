wires:
  - id: pd-power
    from: psu.VBUS
    to: jetson.USBC
    color: '#c62828'
    label: USB-C PD 19 V
    voltage: 19
    lengthMm: 1200
    diameterMm: 3.2
    notes: USB-C PD to the Jetson power jack. Not a 5 V USB phone cable.
  - id: pd-ground
    from: psu.GND
    to: jetson.GND
    color: '#212121'
    voltage: 0
    net: GND
  - id: cam-usb
    from: camera.USB
    to: jetson.USB3
    color: '#1565c0'
    label: USB 3 UVC
    lengthMm: 3000
    diameterMm: 4
    gaugeAwg: 28
    notes: Camera is bus-powered. Long or poor cables can drop the UVC device.
  - id: nvme
    from: ssd.M2
    to: jetson.M2M
    color: '#6d4c41'
    label: NVMe
    lengthMm: 40
    diameterMm: 1.2
    notes: Internal M.2 Key M. Shown as a short interconnect, not a jumper wire.
  - id: wifi-m2
    from: wifi.M2
    to: jetson.M2E
    color: '#7b1fa2'
    label: M.2 WiFi
    dashed: true
    lengthMm: 30
    diameterMm: 1.2
    notes: Dashed because Ethernet is the default lab path.
  - id: ant-a
    from: wifi.IPEX1
    to: ant1.CABLE
    color: '#212121'
    label: IPEX A
    dashed: true
    diameterMm: 1.2
  - id: ant-b
    from: wifi.IPEX2
    to: ant2.CABLE
    color: '#212121'
    label: IPEX B
    dashed: true
    diameterMm: 1.2
  - id: ethernet
    from: lan.ETH
    to: jetson.ETH
    color: '#2e7d32'
    label: Gigabit Ethernet
    lengthMm: 1500
    diameterMm: 5
    notes: Preferred lab network. Use WiFi only when reproducing field bandwidth.
  - id: hdmi
    from: display.HDMI
    to: jetson.HDMI
    color: '#546e7a'
    label: HDMI
    dashed: true
    lengthMm: 500
    diameterMm: 6
    notes: Optional. Unplug before outdoor or unattended runs.
  - id: cs-mount
    from: lens.CS
    to: camera.CS
    color: '#ef6c00'
    label: CS/C mount
    dashed: true
    diameterMm: 2
    notes: Mechanical mount, not an electrical net.
  - id: tripod
    from: mount.THREAD
    to: camera.TRIPOD
    color: '#8d6e63'
    label: '1/4 inch'
    dashed: true
    diameterMm: 2
    notes: Mechanical fastener.
  - id: fixture
    from: frame.SLOT
    to: mount.BASE
    color: '#546e7a'
    label: Fixture
    dashed: true
    diameterMm: 2
  - id: window
    from: cover.FACE
    to: lens.FRONT
    color: '#90caf9'
    label: Optical sample
    dashed: true
    diameterMm: 1.4
    notes: Place the acrylic in the optical path only for glare and condensation tests.
