version: 1
title: Complete lab wiring
description: ESP32 + HX711 + load cell + DS18B20 · Phase 1 bench
notes:
  - Disconnect USB before changing wires. All modules share one GND rail.
  - USB 5 V feeds the ESP32 VIN/5V pin and HX711 VCC. DS18B20 VDD stays on 3.3 V.
  - The 4.7 kΩ resistor joins 3.3 V to DQ. Never connect DQ directly to the power rail.
  - GPIO 21, 22, 34 and 35 stay open for later sensors.
  - Component sizes and pin anchors are illustrative. Match printed pin labels on the actual boards.
groups:
  - { id: power, label: USB POWER, color: '#5c9fb5' }
  - { id: control, label: CONTROLLER, color: '#d2a454' }
  - { id: weight, label: WEIGHT CHAIN, color: '#64a888' }
  - { id: temp, label: TEMPERATURE CHAIN, color: '#b681a5' }
components:
  - id: usb
    label: USB 5 V / 2 A
    kind: power
    group: power
    dimensions: [28, 14, 22]
    position: [-88, 8, 0]
    schematic: [70, 95]
    pins:
      - { id: VBUS, label: '5 V', side: right, voltage: 5, position: [14, 2, -4] }
      - { id: GND, side: right, voltage: 0, position: [14, 2, 4] }
    notes: VBUS and GND are the USB cable conductors, not a second supply into VIN while USB is attached.
  - id: esp
    label: ESP32 DevKit
    kind: esp32
    group: control
    dimensions: [52, 3, 28]
    position: [-20, 6, 0]
    schematic: [420, 95]
    pinout: esp32-devkit-38
    properties: { variant: 'ESP32-WROOM development board', logic: '3.3 V only' }
    pins:
      # WHY: number/gpio bind 3D wires to DevKit header contacts and show Pin N / GPIOx on the schematic.
      - { id: VIN, label: '5 V / VIN', number: 19, side: left, voltage: 5 }
      - { id: GND, number: 14, side: left, voltage: 0 }
      - { id: 3V3, label: '3.3 V', number: 1, side: right, voltage: 3.3 }
      - { id: IO16, label: DT, number: 27, gpio: 16, side: right }
      - { id: IO17, label: SCK, number: 28, gpio: 17, side: right }
      - { id: IO4, label: DQ, number: 26, gpio: 4, side: right }
  - id: hx
    label: HX711 amplifier
    kind: hx711
    group: weight
    dimensions: [33, 2, 21]
    position: [55, 6, -20]
    schematic: [820, 95]
    properties: { supply: '5 V in this lab build; the breakout also accepts 3.3 V' }
    pins:
      - { id: VCC, side: left, voltage: 5, position: [-15, 3, -7.5] }
      - { id: DT, side: left, position: [-15, 3, -2.5] }
      - { id: SCK, side: left, position: [-15, 3, 2.5] }
      - { id: GND, side: left, voltage: 0, position: [-15, 3, 7.5] }
      - { id: E+, side: right, position: [14, 4, -7.5] }
      - { id: E-, side: right, position: [14, 4, -2.5] }
      - { id: A+, side: right, position: [14, 4, 2.5] }
      - { id: A-, side: right, position: [14, 4, 7.5] }
  - id: load
    label: Load cell
    kind: load-cell
    group: weight
    dimensions: [75, 13, 13]
    position: [140, 7, -32]
    schematic: [1210, 95]
    pins:
      - { id: E+, label: 'E+ · red', side: left, position: [-37.5, 2, -4] }
      - { id: E-, label: 'E- · black', side: left, position: [-37.5, 2, -1.3] }
      - { id: A+, label: 'A+ · white', side: left, position: [-37.5, 2, 1.3] }
      - { id: A-, label: 'A- · green', side: left, position: [-37.5, 2, 4] }
    notes: Screw terminals on the HX711, not GPIO. Wire colours vary; confirm excitation and signal pairs from the datasheet.
  - id: pullup
    label: 4.7 kOhm pull-up
    kind: resistor
    group: temp
    dimensions: [10, 3, 3]
    position: [56, 6, 45]
    schematic: [820, 400]
    pins:
      - { id: VCC, side: left, position: [-7, 0, 0] }
      - { id: DQ, side: right, position: [7, 0, 0] }
    properties: { resistance: '4.7 kOhm' }
  - id: probe
    label: DS18B20 probe
    kind: probe
    group: temp
    dimensions: [50, 6, 6]
    position: [132, 5, 54]
    schematic: [1210, 400]
    pins:
      - { id: VDD, label: 'VDD · 3.3 V', side: left, voltage: 3.3, position: [-28, 1.5, -2] }
      - { id: DQ, label: DQ data, side: left, position: [-28, 1.5, 0] }
      - { id: GND, side: left, voltage: 0, position: [-28, 1.5, 2] }
    notes: Do not power this probe from 5 V.
wires:
  - { id: usb-power, from: usb.VBUS, to: esp.VIN, color: '#c62828', label: USB 5 V, voltage: 5, lengthMm: 200, diameterMm: 1.6 }
  - { id: usb-ground, from: usb.GND, to: esp.GND, color: '#212121', voltage: 0, net: GND }
  - { id: hx-power, from: esp.VIN, to: hx.VCC, color: '#c62828', label: 5 V, voltage: 5, net: 5V }
  - { id: hx-ground, from: esp.GND, to: hx.GND, color: '#212121', voltage: 0, net: GND }
  - { id: hx-data, from: esp.GPIO16, to: hx.DT, color: '#ef6c00', label: DT, lengthMm: 150, gaugeAwg: 26, notes: Orange jumper to HX711 DT }
  - { id: hx-clock, from: esp.GPIO17, to: hx.SCK, color: '#1565c0', label: SCK, lengthMm: 150, gaugeAwg: 26, notes: Blue jumper to HX711 SCK }
  - { id: load-excite-plus, from: hx.E+, to: load.E+, color: '#c62828' }
  - { id: load-excite-minus, from: hx.E-, to: load.E-, color: '#212121' }
  - { id: load-signal-plus, from: hx.A+, to: load.A+, color: '#b0b8ba', notes: White conductor. Shown gray in 2D for contrast. }
  - { id: load-signal-minus, from: hx.A-, to: load.A-, color: '#2e7d32' }
  - { id: probe-power, from: esp.3V3, to: probe.VDD, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3, notes: Dashed red is 3.3 V only. Do not tie DS18B20 VDD to the 5 V rail. }
  - { id: pullup-power, from: esp.3V3, to: pullup.VCC, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: probe-data, from: esp.GPIO4, to: pullup.DQ, color: '#6d4c41', net: DQ, notes: Brown jumper to the data node }
  - { id: probe-data-tail, from: pullup.DQ, to: probe.DQ, color: '#6d4c41', label: DQ, net: DQ }
  - { id: probe-ground, from: esp.GND, to: probe.GND, color: '#212121', voltage: 0, net: GND }
