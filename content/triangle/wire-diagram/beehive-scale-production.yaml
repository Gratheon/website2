version: 1
title: Beehive scale pod wiring
description: Phase 3 production kit · ESP32-S3 pod, battery cartridge, accessory connector, hive climate probe
notes:
  - Everything electrical sits on the base, which is not weighed. The pod mates with a 12-pin dock connector at the back of its bay; an internal harness in the base runs from the dock to the load cell, the accessory connector, the ambient sensor and the sensor port. The dock is not drawn as its own part.
  - The scale has no solar panel and no landing board. Stand-alone it runs on the battery cartridge and charges over USB-C. An Entrance Observer (or the Robotic Beehive harness) on the accessory connector supplies 5 V and a UART link.
  - The accessory connector is an M12 8-pin socket under the front rail, with a dust cap when unused. Pinout 1 VIN (5 V in), 2 GND, 3 3V3_SW, 4 1-Wire (reserved for identification), 5 UART TX (pod to accessory), 6 UART RX, 7 WAKE (accessory to pod, open drain), 8 shield. The Entrance Observer accessory port uses the same pinout.
  - The hive climate probe (SHT45) plugs into the sensor port in the front-right hive locator on the deck. A flat 4-core service loop runs from the port through the deck and down inside the skirt to the harness.
  - VIN from the accessory connector and VBUS from the USB-C port are OR-ed by an LM66200 ideal diode, so neither back-feeds the other.
  - The 18650 cells sit in a slide-out cartridge, all in parallel (1S). Ship 2 or 4 cells; never mix old and new cells.
  - The TPS22917 load switch powers the HX711, load-cell excitation, the climate probe and the OLED only while measuring or while the display is on. The probe and the OLED share the second I2C bus (IO15, IO16), so unpowered parts never load the always-on bus.
  - SHT40 (ambient), MAX17048 and the LIS2DH12 tilt sensor share the always-on I2C bus (IO8, IO9). The tilt sensor replaces a bubble level; the pod display shows the tilt while levelling, and its interrupt on IO2 wakes the pod if the scale is knocked or tipped.
  - The optional SX1262 LoRa module (SPI on IO33–IO37, BUSY IO13, DIO1 IO14, RST IO21) is not shown.
