    kind: load-cell
    group: weight
    dimensions: [75, 13, 13]
    position: [150, 7, -10]
    schematic: [1300, 220]
    purchase: { url: 'https://www.alibaba.com/product-detail/AP62AFB-200kg-350kg-Liquid-Automatic-Quantitative_1601491747233.html', label: 'AP62AFB on Alibaba' }
    pins:
      - { id: E+, side: left }
      - { id: E-, side: left }
      - { id: A+, side: left }
      - { id: A-, side: left }
