    kind: board
    group: service
    dimensions: [12, 6, 12]
    position: [40, 5, -60]
    schematic: [660, 660]
    pins:
      - { id: A, side: left }
      - { id: B, side: left }
    notes: A short press shows stats for 15 s and sends a reading; a 5 s hold starts BLE setup. IO1 is an RTC GPIO, so the button wakes the pod from deep sleep.
