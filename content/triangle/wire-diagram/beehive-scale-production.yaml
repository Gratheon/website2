      - { id: GND, side: left, voltage: 0 }
      - { id: SDA, side: left }
      - { id: SCL, side: left }
    notes: In a louvred pocket in the left wall of the base, wired through the internal harness. I2C address 0x44.
wires:
  # accessory (Entrance Observer or robot) → connector
  - { id: acc-5v, from: eo.V5, to: fmi.VIN, color: '#e65100', label: 5 V, voltage: 5 }
  - { id: acc-gnd, from: eo.GND, to: fmi.GND, color: '#212121', voltage: 0, net: GND }
  - { id: acc-tx, from: eo.TX, to: fmi.ARX, color: '#00897b' }
  - { id: acc-rx, from: eo.RX, to: fmi.ATX, color: '#00897b' }
  - { id: acc-wake, from: eo.WAKE, to: fmi.AWAKE, color: '#7cb342' }
  # connector → pod (internal harness + dock)
  - { id: vin-pod, from: fmi.VINP, to: oring.IN1, color: '#e65100', label: VIN, voltage: 5 }
  - { id: gnd-pod, from: fmi.GNDP, to: oring.GND, color: '#212121', voltage: 0, net: GND }
  - { id: uart-tx, from: esp.IO43, to: fmi.TX, color: '#00897b', label: UART }
  - { id: uart-rx, from: esp.IO44, to: fmi.RX, color: '#00897b' }
  - { id: fmi-wake, from: esp.IO18, to: fmi.WAKE, color: '#7cb342', label: WAKE }
  - { id: ow-front, from: pullup.DQ, to: fmi.OWP, color: '#6d4c41', net: DQ }
  - { id: ow-esp, from: esp.IO6, to: pullup.DQ, color: '#6d4c41', label: 1-Wire, net: DQ }
  - { id: pullup-power, from: loadsw.VOUT, to: pullup.VCC, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  # power path
  - { id: usb-vbus, from: usbc.VBUS, to: oring.IN2, color: '#e65100', label: VBUS, voltage: 5 }
  - { id: usb-gnd, from: usbc.GND, to: oring.GND, color: '#212121', voltage: 0, net: GND }
  - { id: usb-dm, from: usbc.DM, to: esp.IO19, color: '#78909c' }
  - { id: usb-dp, from: usbc.DP, to: esp.IO20, color: '#78909c' }
  - { id: or-out, from: oring.OUT, to: charger.IN, color: '#e65100', voltage: 6 }
  - { id: bat-plus, from: cells.BAT+, to: charger.BAT, color: '#c62828', label: BAT, voltage: 3.7, gaugeAwg: 20 }
  - { id: bat-minus, from: cells.BAT-, to: charger.GND, color: '#212121', voltage: 0, net: GND, gaugeAwg: 20 }
  - { id: bat-ntc, from: cells.NTC, to: charger.TS, color: '#6a1b9a', label: NTC }
  - { id: or-gnd, from: oring.GND, to: charger.GND, color: '#212121', voltage: 0, net: GND }
  - { id: gauge-cell, from: cells.BAT+, to: gauge.CELL, color: '#c62828', voltage: 3.7 }
  - { id: gauge-gnd, from: cells.BAT-, to: gauge.GND, color: '#212121', voltage: 0, net: GND }
  - { id: sys-rail, from: charger.OUT, to: buck.VIN, color: '#c62828', label: SYS, voltage: 4.2 }
  - { id: buck-gnd, from: charger.GND, to: buck.GND, color: '#212121', voltage: 0, net: GND }
  - { id: rail-3v3, from: buck.VOUT, to: esp.3V3, color: '#c62828', label: 3V3, voltage: 3.3, dashed: true, net: 3V3 }
  - { id: esp-gnd, from: buck.GND, to: esp.GND, color: '#212121', voltage: 0, net: GND }
  - { id: chg-status, from: charger.CHG, to: esp.IO10, color: '#546e7a' }
  - { id: pgood-status, from: charger.PGOOD, to: esp.IO11, color: '#546e7a' }
  # always-on I2C bus
  - { id: gauge-sda, from: gauge.SDA, to: esp.IO8, color: '#1565c0', label: SDA, net: SDA }
  - { id: gauge-scl, from: gauge.SCL, to: esp.IO9, color: '#00838f', label: SCL, net: SCL }
  - { id: sht-power, from: buck.VOUT, to: sht.VDD, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: sht-gnd, from: esp.GND, to: sht.GND, color: '#212121', voltage: 0, net: GND }
  - { id: sht-sda, from: sht.SDA, to: esp.IO8, color: '#1565c0', net: SDA }
  - { id: sht-scl, from: sht.SCL, to: esp.IO9, color: '#00838f', net: SCL }
  # switched sensor rail
  - { id: sw-in, from: buck.VOUT, to: loadsw.VIN, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: sw-enable, from: esp.IO7, to: loadsw.ON, color: '#f9a825', label: SENS_EN }
  - { id: hx-power, from: loadsw.VOUT, to: hx.VCC, color: '#ad1457', label: 3V3_SW, voltage: 3.3, net: 3V3_SW }
  - { id: hx-gnd, from: esp.GND, to: hx.GND, color: '#212121', voltage: 0, net: GND }
  - { id: hx-data, from: esp.IO4, to: hx.DT, color: '#ef6c00', label: DOUT }
  - { id: hx-clock, from: esp.IO5, to: hx.SCK, color: '#1565c0', label: SCK }
  - { id: load-excite-plus, from: hx.E+, to: lc.E+, color: '#c62828' }
  - { id: load-excite-minus, from: hx.E-, to: lc.E-, color: '#212121' }
  - { id: load-signal-plus, from: hx.A+, to: lc.A+, color: '#b0b8ba', notes: 'White conductor, shown grey for contrast.' }
  - { id: load-signal-minus, from: hx.A-, to: lc.A-, color: '#2e7d32' }
  # pod face
  - { id: button-in, from: esp.IO1, to: button.A, color: '#7cb342', label: BTN }
  - { id: button-gnd, from: esp.GND, to: button.B, color: '#212121', voltage: 0, net: GND }
  - { id: oled-power, from: loadsw.VOUT, to: oled.VCC, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: oled-gnd, from: esp.GND, to: oled.GND, color: '#212121', voltage: 0, net: GND }
  - { id: oled-sda, from: esp.IO15, to: oled.SDA, color: '#3949ab', label: SDA1 }
  - { id: oled-scl, from: esp.IO16, to: oled.SCL, color: '#00acc1', label: SCL1 }
  # hive climate probe on the second I2C bus, through the sensor port and service loop
  - { id: probe-power, from: loadsw.VOUT, to: probe.VDD, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: probe-gnd, from: esp.GND, to: probe.GND, color: '#212121', voltage: 0, net: GND }
  - { id: probe-sda, from: esp.IO15, to: probe.SDA, color: '#3949ab', net: SDA1 }
  - { id: probe-scl, from: esp.IO16, to: probe.SCL, color: '#00acc1', net: SCL1 }
  # tilt sensor on the always-on bus
  - { id: accel-power, from: buck.VOUT, to: accel.VDD, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: accel-gnd, from: esp.GND, to: accel.GND, color: '#212121', voltage: 0, net: GND }
  - { id: accel-sda, from: esp.IO8, to: accel.SDA, color: '#1565c0', net: SDA }
  - { id: accel-scl, from: esp.IO9, to: accel.SCL, color: '#00838f', net: SCL }
  - { id: accel-int, from: esp.IO2, to: accel.INT1, color: '#7cb342', label: TILT }
