version: 1
title: Beehive scale pod wiring
description: Phase 3 production kit · ESP32-S3 carrier PCB, 18650 pack, M8 field connectors
notes:
  - Everything left of the M8 sockets is on the carrier PCB. Field parts (load cell, hive probe, solar panel) plug into the pod through sealed M8 connectors.
  - The 18650 cells are wired in parallel (1S). Ship 2 or 4 cells; slots without a cell stay empty. Never mix old and new cells.
  - The TPS22917 load switch powers the HX711, load-cell excitation and DS18B20 only while measuring (about 0.6 s every 10 minutes). Drive IO4, IO5 and IO6 low or as inputs while it is off, so the ESP32 does not back-power the sensors.
  - SHT40 and MAX17048 share the always-on I2C bus (IO8 SDA, IO9 SCL, 10 kΩ pull-ups to 3.3 V on the PCB). Both idle below 1 µA.
  - In the Robotic Beehive the solar port takes the robot's fused 5 V rail instead of a panel. The pod then also drives the watchdog relay and talks to the Jetson over UART (IO43/IO44, not shown).
  - The optional SX1262 LoRa module (SPI on IO33–IO37, BUSY IO13, DIO1 IO14, RST IO21) is not shown; it is not fitted on the Wi-Fi SKU.
  - Pin choices avoid ESP32-S3 strapping pins (IO0, IO3, IO45, IO46) and the USB pins (IO19, IO20), which go to the factory pogo pads.
