  - { id: climate, label: CLIMATE, color: '#b681a5' }
components:
  - id: solar
    label: Solar landing board · 6 V 2.5 W
    kind: power
    group: front
    dimensions: [60, 4, 20]
    position: [-160, 2, 80]
    schematic: [40, 40]
    pins:
      - { id: V+, label: 'PANEL+', side: right, voltage: 6 }
      - { id: GND, label: 'PANEL−', side: right, voltage: 0 }
    notes: The ETFE panel is the landing board when the entrance faces south. On a south-facing side rail (wing) or on the lid, the same panel plugs into the plain landing board's auxiliary input instead.
  - id: probe
    label: DS18B20 hive probe (via entrance)
    kind: probe
    group: front
    dimensions: [50, 6, 6]
    position: [-160, 4, 120]
    schematic: [40, 240]
    pins:
      - { id: VDD, label: 'VDD · 3.3 V', side: right, voltage: 3.3 }
      - { id: DQ, side: right }
      - { id: GND, side: right, voltage: 0 }
    notes: Plugs into the socket on the landing board's rear edge and is pushed in through the entrance.
  - id: idchip
    label: DS28E07 module ID
    kind: board
    group: front
    dimensions: [5, 1, 5]
    position: [-120, 3, 100]
    schematic: [40, 430]
    pins:
      - { id: DQ, side: right }
      - { id: GND, side: right, voltage: 0 }
    notes: 1-Wire EEPROM on every front module. Stores module type, panel watts and serial number.
  - id: fmi
    label: M12 8-pin front-module connector
    kind: board
    group: front
    dimensions: [16, 14, 16]
    position: [-90, 5, 60]
    schematic: [330, 40]
    pins:
      - { id: VIN, label: '1 · VIN', side: left, voltage: 6 }
      - { id: GND, label: '2 · GND', side: left, voltage: 0 }
      - { id: SW, label: '3 · 3V3_SW', side: left, voltage: 3.3 }
      - { id: OW, label: '4 · 1-Wire', side: left }
      - { id: TX, label: '5 · UART TX', side: right }
      - { id: RX, label: '6 · UART RX', side: right }
      - { id: WAKE, label: '7 · WAKE', side: right }
      - { id: VINP, label: 'VIN to pod', side: right, voltage: 6 }
      - { id: GNDP, label: 'GND to pod', side: right, voltage: 0 }
      - { id: SWP, label: '3V3_SW from pod', side: right, voltage: 3.3 }
      - { id: OWP, label: '1-Wire to pod', side: right }
    notes: Right-hand pins continue through the internal harness and the dock connector to the pod PCB. Pin 8 (shield) is bonded to the base.
  - id: usbc
    label: USB-C on the pod face
    kind: board
    group: power
    dimensions: [9, 3, 7]
    position: [-60, 3, -60]
    schematic: [40, 660]
    pins:
      - { id: VBUS, side: right, voltage: 5 }
      - { id: GND, side: right, voltage: 0 }
      - { id: DM, label: 'D−', side: right }
      - { id: DP, label: 'D+', side: right }
    notes: 5.1 kΩ CC pull-downs, so any USB-C charger or power bank delivers 5 V. Behind a rubber flap.
  - id: cells
    label: Battery cartridge · 2–4 × 18650 (1S)
    kind: power
    group: power
    dimensions: [70, 20, 82]
    position: [-150, 10, -20]
    schematic: [40, 920]
    pins:
      - { id: BAT+, label: 'BAT+ · 3.0–4.2 V', side: right, voltage: 3.7 }
      - { id: NTC, side: right }
      - { id: BAT-, label: 'BAT−', side: right, voltage: 0 }
  - id: oring
    label: LM66200 ideal-diode OR
    kind: board
    group: power
    dimensions: [3, 1, 3]
    position: [-80, 3, -30]
    schematic: [330, 660]
    pins:
      - { id: IN1, label: 'IN1 · front VIN', side: left, voltage: 6 }
      - { id: IN2, label: 'IN2 · USB VBUS', side: left, voltage: 5 }
      - { id: OUT, side: right, voltage: 6 }
      - { id: GND, side: right, voltage: 0 }
  - id: charger
    label: BQ24074 charger + power path
    kind: board
    group: power
    dimensions: [12, 2, 12]
    position: [-80, 3, 0]
    schematic: [330, 820]
    pins:
      - { id: IN, side: left, voltage: 6 }
      - { id: BAT, side: left, voltage: 3.7 }
      - { id: TS, side: left }
      - { id: GND, side: left, voltage: 0 }
      - { id: OUT, label: 'OUT · system rail', side: right, voltage: 4.2 }
      - { id: CHG, side: right }
      - { id: PGOOD, side: right }
    notes: Blocks charging outside 0–45 °C via TS. 500 mA charge current.
  - id: gauge
    label: MAX17048 fuel gauge
    kind: board
    group: power
    dimensions: [8, 2, 8]
    position: [-80, 3, 30]
    schematic: [330, 1080]
    pins:
      - { id: CELL, side: left, voltage: 3.7 }
      - { id: GND, side: left, voltage: 0 }
      - { id: SDA, side: right }
      - { id: SCL, side: right }
  - id: buck
    label: TPS62840 3.3 V buck
    kind: board
    group: power
    dimensions: [8, 2, 8]
    position: [-40, 3, -20]
    schematic: [330, 1260]
    pins:
      - { id: VIN, side: left, voltage: 4.2 }
      - { id: GND, side: left, voltage: 0 }
      - { id: VOUT, label: '3V3', side: right, voltage: 3.3 }
  - id: esp
    label: ESP32-S3-MINI-1 module
    kind: board
    group: control
    dimensions: [15.4, 2.4, 20.5]
    position: [0, 3, 0]
    schematic: [660, 40]
    properties: { flash: '8 MB', radio: 'Wi-Fi 2.4 GHz + BLE 5', deepSleep: 'about 8 µA' }
    pins:
      - { id: 3V3, side: left, voltage: 3.3 }
      - { id: GND, side: left, voltage: 0 }
      - { id: IO10, label: 'IO10 · CHG', side: left }
      - { id: IO11, label: 'IO11 · PGOOD', side: left }
      - { id: IO8, label: 'IO8 · SDA', side: left }
      - { id: IO9, label: 'IO9 · SCL', side: left }
      - { id: IO19, label: 'IO19 · USB D−', side: left }
      - { id: IO20, label: 'IO20 · USB D+', side: left }
      - { id: IO43, label: 'IO43 · UART TX', side: left }
      - { id: IO44, label: 'IO44 · UART RX', side: left }
      - { id: IO18, label: 'IO18 · FMI WAKE', side: left }
      - { id: IO7, label: 'IO7 · SENS_EN', side: right }
      - { id: IO4, label: 'IO4 · HX DOUT', side: right }
      - { id: IO5, label: 'IO5 · HX SCK', side: right }
      - { id: IO6, label: 'IO6 · 1-Wire', side: right }
      - { id: IO1, label: 'IO1 · button', side: right }
      - { id: IO15, label: 'IO15 · OLED SDA', side: right }
      - { id: IO16, label: 'IO16 · OLED SCL', side: right }
    notes: Pin map differs from the Phase 1 DevKit bench. Firmware selects the map by hardware revision.
  - id: button
    label: Face button (sealed)
    kind: board
    group: service
    dimensions: [12, 6, 12]
    position: [40, 5, -60]
    schematic: [660, 660]
    pins:
      - { id: A, side: left }
      - { id: B, side: left }
    notes: A short press shows stats for 15 s and sends a reading; a 5 s hold starts BLE setup. IO1 is an RTC GPIO, so the button wakes the pod from deep sleep.
  - id: oled
    label: 0.96″ OLED 128×64 (SSD1306)
    kind: board
    group: service
    dimensions: [27, 3, 27]
    position: [40, 5, -30]
    schematic: [660, 820]
    pins:
      - { id: VCC, side: left, voltage: 3.3 }
      - { id: GND, side: left, voltage: 0 }
      - { id: SDA, side: left }
      - { id: SCL, side: left }
    notes: Powered from 3V3_SW only while shown. Works down to −40 °C.
  - id: loadsw
    label: TPS22917 sensor load switch
    kind: board
    group: weight
    dimensions: [6, 1, 6]
    position: [40, 3, 30]
    schematic: [980, 40]
    pins:
      - { id: VIN, side: left, voltage: 3.3 }
      - { id: ON, side: left }
      - { id: VOUT, label: '3V3_SW', side: right, voltage: 3.3 }
  - id: hx
    label: HX711 ADC (on PCB)
    kind: hx711
    group: weight
    dimensions: [33, 2, 21]
    position: [60, 3, 0]
    schematic: [980, 220]
    pins:
      - { id: VCC, side: left, voltage: 3.3 }
      - { id: DT, side: left }
      - { id: SCK, side: left }
      - { id: GND, side: left, voltage: 0 }
      - { id: E+, side: right }
      - { id: E-, side: right }
      - { id: A+, side: right }
      - { id: A-, side: right }
    notes: Gain 128, 10 Hz. 16 samples are averaged per reading.
  - id: lc
    label: AP62AFB load cell (internal harness)
    kind: load-cell
    group: weight
    dimensions: [75, 13, 13]
    position: [150, 7, -10]
    schematic: [1300, 220]
    purchase: { url: 'https://www.alibaba.com/product-detail/AP62AFB-200kg-350kg-Liquid-Automatic-Quantitative_1601491747233.html', label: 'AP62AFB on Alibaba' }
    pins:
      - { id: E+, side: left }
      - { id: E-, side: left }
      - { id: A+, side: left }
      - { id: A-, side: left }
    notes: The lead stays inside the base and ends in the dock connector. Confirm lead colours on the delivered cell.
  - id: pullup
    label: 4.7 kΩ pull-up
    kind: resistor
    group: climate
    dimensions: [10, 3, 3]
    position: [60, 3, 40]
    schematic: [980, 560]
    pins:
      - { id: VCC, side: left }
      - { id: DQ, side: right }
    properties: { resistance: '4.7 kΩ' }
  - id: sht
    label: SHT40 ambient T/RH (base wall pocket)
    kind: board
    group: climate
    dimensions: [8, 2, 8]
    position: [-60, 3, 60]
    schematic: [980, 700]
    pins:
      - { id: VDD, side: left, voltage: 3.3 }
      - { id: GND, side: left, voltage: 0 }
      - { id: SDA, side: left }
      - { id: SCL, side: left }
    notes: In a louvred pocket in the left wall of the base, wired through the internal harness. I2C address 0x44.
wires:
  # front module → connector
  - { id: panel-plus, from: solar.V+, to: fmi.VIN, color: '#e65100', label: PANEL, voltage: 6 }
  - { id: panel-gnd, from: solar.GND, to: fmi.GND, color: '#212121', voltage: 0, net: GND }
  - { id: probe-power, from: probe.VDD, to: fmi.SW, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: probe-data, from: probe.DQ, to: fmi.OW, color: '#6d4c41', label: 1-Wire, net: DQ }
  - { id: probe-gnd, from: probe.GND, to: fmi.GND, color: '#212121', voltage: 0, net: GND }
  - { id: id-data, from: idchip.DQ, to: fmi.OW, color: '#6d4c41', net: DQ }
  - { id: id-gnd, from: idchip.GND, to: fmi.GND, color: '#212121', voltage: 0, net: GND }
  # connector → pod (internal harness + dock)
  - { id: vin-pod, from: fmi.VINP, to: oring.IN1, color: '#e65100', label: VIN, voltage: 6 }
  - { id: gnd-pod, from: fmi.GNDP, to: oring.GND, color: '#212121', voltage: 0, net: GND }
  - { id: sw-front, from: loadsw.VOUT, to: fmi.SWP, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: ow-front, from: pullup.DQ, to: fmi.OWP, color: '#6d4c41', net: DQ }
  - { id: uart-tx, from: esp.IO43, to: fmi.TX, color: '#00897b', label: UART }
  - { id: uart-rx, from: esp.IO44, to: fmi.RX, color: '#00897b' }
  - { id: fmi-wake, from: esp.IO18, to: fmi.WAKE, color: '#7cb342', label: WAKE }
  # power path
  - { id: usb-vbus, from: usbc.VBUS, to: oring.IN2, color: '#e65100', label: VBUS, voltage: 5 }
  - { id: usb-gnd, from: usbc.GND, to: oring.GND, color: '#212121', voltage: 0, net: GND }
  - { id: usb-dm, from: usbc.DM, to: esp.IO19, color: '#78909c' }
  - { id: usb-dp, from: usbc.DP, to: esp.IO20, color: '#78909c' }
  - { id: or-out, from: oring.OUT, to: charger.IN, color: '#e65100', voltage: 6 }
  - { id: bat-plus, from: cells.BAT+, to: charger.BAT, color: '#c62828', label: BAT, voltage: 3.7, gaugeAwg: 20 }
  - { id: bat-minus, from: cells.BAT-, to: charger.GND, color: '#212121', voltage: 0, net: GND, gaugeAwg: 20 }
  - { id: bat-ntc, from: cells.NTC, to: charger.TS, color: '#6a1b9a', label: NTC }
  - { id: or-gnd, from: oring.GND, to: charger.GND, color: '#212121', voltage: 0, net: GND }
  - { id: gauge-cell, from: cells.BAT+, to: gauge.CELL, color: '#c62828', voltage: 3.7 }
  - { id: gauge-gnd, from: cells.BAT-, to: gauge.GND, color: '#212121', voltage: 0, net: GND }
  - { id: sys-rail, from: charger.OUT, to: buck.VIN, color: '#c62828', label: SYS, voltage: 4.2 }
  - { id: buck-gnd, from: charger.GND, to: buck.GND, color: '#212121', voltage: 0, net: GND }
  - { id: rail-3v3, from: buck.VOUT, to: esp.3V3, color: '#c62828', label: 3V3, voltage: 3.3, dashed: true, net: 3V3 }
  - { id: esp-gnd, from: buck.GND, to: esp.GND, color: '#212121', voltage: 0, net: GND }
  - { id: chg-status, from: charger.CHG, to: esp.IO10, color: '#546e7a' }
  - { id: pgood-status, from: charger.PGOOD, to: esp.IO11, color: '#546e7a' }
  # always-on I2C bus
  - { id: gauge-sda, from: gauge.SDA, to: esp.IO8, color: '#1565c0', label: SDA, net: SDA }
  - { id: gauge-scl, from: gauge.SCL, to: esp.IO9, color: '#00838f', label: SCL, net: SCL }
  - { id: sht-power, from: buck.VOUT, to: sht.VDD, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: sht-gnd, from: esp.GND, to: sht.GND, color: '#212121', voltage: 0, net: GND }
  - { id: sht-sda, from: sht.SDA, to: esp.IO8, color: '#1565c0', net: SDA }
  - { id: sht-scl, from: sht.SCL, to: esp.IO9, color: '#00838f', net: SCL }
  # switched sensor rail
  - { id: sw-in, from: buck.VOUT, to: loadsw.VIN, color: '#c62828', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: sw-enable, from: esp.IO7, to: loadsw.ON, color: '#f9a825', label: SENS_EN }
  - { id: hx-power, from: loadsw.VOUT, to: hx.VCC, color: '#ad1457', label: 3V3_SW, voltage: 3.3, net: 3V3_SW }
  - { id: hx-gnd, from: esp.GND, to: hx.GND, color: '#212121', voltage: 0, net: GND }
  - { id: hx-data, from: esp.IO4, to: hx.DT, color: '#ef6c00', label: DOUT }
  - { id: hx-clock, from: esp.IO5, to: hx.SCK, color: '#1565c0', label: SCK }
  - { id: load-excite-plus, from: hx.E+, to: lc.E+, color: '#c62828' }
  - { id: load-excite-minus, from: hx.E-, to: lc.E-, color: '#212121' }
  - { id: load-signal-plus, from: hx.A+, to: lc.A+, color: '#b0b8ba', notes: 'White conductor, shown grey for contrast.' }
  - { id: load-signal-minus, from: hx.A-, to: lc.A-, color: '#2e7d32' }
  - { id: pullup-power, from: loadsw.VOUT, to: pullup.VCC, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: ow-esp, from: esp.IO6, to: pullup.DQ, color: '#6d4c41', label: 1-Wire, net: DQ }
  # pod face
  - { id: button-in, from: esp.IO1, to: button.A, color: '#7cb342', label: BTN }
  - { id: button-gnd, from: esp.GND, to: button.B, color: '#212121', voltage: 0, net: GND }
  - { id: oled-power, from: loadsw.VOUT, to: oled.VCC, color: '#ad1457', voltage: 3.3, net: 3V3_SW }
  - { id: oled-gnd, from: esp.GND, to: oled.GND, color: '#212121', voltage: 0, net: GND }
  - { id: oled-sda, from: esp.IO15, to: oled.SDA, color: '#3949ab', label: SDA1 }
  - { id: oled-scl, from: esp.IO16, to: oled.SCL, color: '#00acc1', label: SCL1 }
