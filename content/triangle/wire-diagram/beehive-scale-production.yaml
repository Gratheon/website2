version: 1
title: Beehive scale pod wiring
description: Phase 3 production kit · ESP32-S3 pod, battery cartridge, front-module connector
notes:
  - Everything electrical sits on the base, which is not weighed. The pod mates with a 12-pin dock connector at the back of its bay; an internal harness in the base runs from the dock to the load cell, the front-module connector and the ambient sensor. The dock is not drawn as its own part.
  - The front-module connector is an M12 8-pin socket under the front rail. Pinout 1 VIN (4.5–6.4 V in), 2 GND, 3 3V3_SW, 4 1-Wire, 5 UART TX (pod to module), 6 UART RX, 7 WAKE (module to pod, open drain), 8 shield. Every front module (solar landing board, plain board, Entrance Observer) and the Robotic Beehive harness uses it.
  - Each front module carries a DS28E07 1-Wire ID chip on the same bus as the hive probe, so the pod knows which module is fitted and its panel rating.
  - VIN from the front module and VBUS from the USB-C port are OR-ed by an LM66200 ideal diode, so a power bank on USB-C and the panel can both charge the cells and never back-feed each other.
  - The 18650 cells sit in a slide-out cartridge, all in parallel (1S). Ship 2 or 4 cells; never mix old and new cells.
  - The TPS22917 load switch powers the HX711, load-cell excitation, DS18B20 and the OLED only while measuring or while the display is on. Keep IO4, IO5, IO6, IO15 and IO16 low or as inputs while it is off.
  - SHT40 and MAX17048 share the always-on I2C bus (IO8, IO9). The OLED has its own bus (IO15, IO16), so the unpowered display never loads the always-on bus.
  - The optional SX1262 LoRa module (SPI on IO33–IO37, BUSY IO13, DIO1 IO14, RST IO21) is not shown.
