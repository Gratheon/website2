server {
    server_name  gratheon.com;

    root /www/website/current;
    index index.html;

    error_page 500 502 503 504 /maintenance.html;

    # English is the default locale and is served from root paths. Keep old
    # /en/... links working after removing default-language generated pages.
    location ~ ^/en(?<canonical_path>/.*)$ {
        return 301 $canonical_path;
    }

    location = /en {
        return 301 /;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|json|xml)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4|mov|pdf)$ {
        expires 7d;
        # WHY: allow browsers to revalidate after we replace broken PDF placeholders.
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location = /maintenance.html {
        internal;
        root /www/website/shared;
        add_header Cache-Control "no-store";
    }

    listen 443 ssl http2; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/gratheon.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gratheon.com/privkey.pem; # managed by Certbot
}

server {
    listen 80;
    server_name gratheon.com;
    return 301 https://$host$request_uri;
}
