server {
    server_name  gratheon.com;

    root /www/website/current;
    index index.html;

    error_page 500 502 503 504 /maintenance.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|json|xml)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4|mov|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /maintenance.html {
        internal;
        root /www/website/shared;
        add_header Cache-Control "no-store";
    }

    location /search {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5700;
    }

    listen 443 ssl http2; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/gratheon.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gratheon.com/privkey.pem; # managed by Certbot
}

server {
    listen 80;
    server_name gratheon.com;
    return 301 https://$host$request_uri;
}
