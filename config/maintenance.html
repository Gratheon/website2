<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Gratheon is updating</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8f3;
      --panel: #ffffff;
      --text: #17210f;
      --muted: #5d6658;
      --accent: #2f8b0b;
      --border: #dfe7d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10140e;
        --panel: #171d14;
        --text: #eef5ea;
        --muted: #b8c4b2;
        --border: #2b3825;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(23, 33, 15, 0.12);
    }

    .brand {
      margin-bottom: 22px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      font-size: 17px;
      color: var(--muted);
    }

    .status {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Gratheon</div>
    <h1>We are refreshing the site.</h1>
    <p>The previous version should be back automatically. Please retry in a minute if this page stays visible.</p>
    <div class="status">Status: deployment in progress</div>
  </main>
</body>
</html>
